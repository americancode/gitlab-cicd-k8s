name: Build, scan, and release

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
      - "*.*.*"
      - "*.*.*-*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: gitlab-cicd-k8s-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Scan source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Scan source files
        id: scan
        run: |
          trivy fs --scanners vuln,misconfig,secret --skip-dirs .git \
            --severity CRITICAL,HIGH --format json --output "${RUNNER_TEMP}/trivy-fs.json" \
            --exit-code 0 .
          trivy convert --format sarif --output "${RUNNER_TEMP}/trivy-fs.sarif" "${RUNNER_TEMP}/trivy-fs.json"
          echo "sarif=true" >> "${GITHUB_OUTPUT}"
      - name: Upload source scan SARIF
        if: ${{ always() && steps.scan.outputs.sarif == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-fs.sarif
          category: trivy-fs
      - name: Enforce source vulnerability gate
        run: |
          count="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' "${RUNNER_TEMP}/trivy-fs.json")"
          echo "HIGH/CRITICAL source vulnerabilities: ${count}"
          [[ "${count}" -eq 0 ]]

  build:
    name: Build and scan ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build quarantine image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          load: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          cache-from: type=gha,scope=gitlab-cicd-k8s-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gitlab-cicd-k8s-${{ matrix.arch }}
          provenance: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'mode=max' || 'false' }}
          sbom: false
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Scan quarantine image
        env:
          QUARANTINE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: trivy image --platform linux/${{ matrix.arch }} --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "${QUARANTINE_IMAGE}"

  publish:
    name: Promote and sign release image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Promote scanned images
        id: promote
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REF_NAME: ${{ github.ref_name }}
          AMD64_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          ARM64_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}-arm64
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid semver release tag: ${REF_NAME}" >&2; exit 1; }
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${AMD64_IMAGE}" "${ARM64_IMAGE}"
          digest=""
          for attempt in {1..30}; do
            digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>/dev/null | awk '/^Digest:/ { print $2; exit }' || true)"
            if [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            echo "Waiting for ${IMAGE}:${VERSION} to become inspectable (attempt ${attempt}/30)"
            sleep 5
          done
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unable to inspect promoted image manifest" >&2; exit 1; }
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${digest}"
            echo "latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "latest=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.promote.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: gitlab-cicd-k8s-${{ steps.promote.outputs.version }}-sbom.spdx.json
          upload-release-assets: false
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Sign promoted image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
      - name: Verify promoted image signature
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: >-
          cosign verify "${IMAGE}@${DIGEST}"
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          --certificate-identity-regexp="^https://github.com/${REPOSITORY}/.github/workflows/.*@refs/tags/${REF_NAME}$"
